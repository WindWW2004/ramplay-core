# ramplay.cfg  -  ld65 linker config for a RamPlay cartridge.
# The output file is the 32768-byte .rpl image, CPU $8000-$FFFF (spec section 8.2).
# SPDX-License-Identifier: MIT

MEMORY {
    ZP:  start = $0000, size = $0100, type = rw, file = "";
    RAM: start = $0200, size = $3E00, type = rw, file = "";
    ROM: start = $8000, size = $7F00, type = ro, file = %O, fill = yes, fillval = $FF;
    HDR: start = $FF00, size = $00FA, type = ro, file = %O, fill = yes, fillval = $FF;
    VEC: start = $FFFA, size = $0006, type = ro, file = %O, fill = yes, fillval = $FF;
}

SEGMENTS {
    ZEROPAGE: load = ZP,  type = zp,  optional = yes;
    BSS:      load = RAM, type = bss, optional = yes, define = yes;
    CODE:     load = ROM, type = ro;
    RODATA:   load = ROM, type = ro,  optional = yes;
    HEADER:   load = HDR, type = ro;
    VECTORS:  load = VEC, type = ro;
}
